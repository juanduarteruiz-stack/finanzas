<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7c66" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Registre sus gastos del día a día en segundos, vea a dónde se va la plata y gane puntos por crear el hábito.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <title>Finanzas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div id="app">
    <header id="barra" class="barra"></header>
    <main id="vista" class="vista" tabindex="-1"></main>
    <nav id="tabs" class="tabs" aria-label="Secciones"></nav>
  </div>

  <div id="fondo-hoja" class="fondo-hoja" hidden></div>
  <section id="hoja" class="hoja" role="dialog" aria-modal="true" aria-label="Registro" hidden></section>
  <div id="celebra" class="celebra" hidden></div>
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <canvas id="confeti" class="confeti" aria-hidden="true" hidden></canvas>

  <noscript><p style="padding:24px">Finanzas necesita JavaScript activado.</p></noscript>

  <script src="js/datos.js"></script>
  <script src="js/juego.js"></script>
  <script src="js/graficos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
